name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto do zip
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -q novel-app.zip -d projeto
          if [ ! -f projeto/settings.gradle.kts ]; then
            inner=$(dirname "$(find projeto -name settings.gradle.kts | head -1)")
            echo "DIR=$inner" >> $GITHUB_ENV
          else
            echo "DIR=projeto" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        run: |
          cd "$DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Novelas build ${{ github.run_number }}"
          body: "APK gerado automaticamente. Baixe o arquivo .apk abaixo e instale."
          files: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
