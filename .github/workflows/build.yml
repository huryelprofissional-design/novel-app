name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar erros
        if: failure()
        run: |
          grep -vE "^> Task" build.log | grep -E "^e: |rror|What went wrong|Could not|^> |Caused by" | head -40 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Novely build ${{ github.run_number }}"
          body: "APK gerado automaticamente. Baixe o arquivo .apk abaixo e instale."
          files: app/build/outputs/apk/debug/*.apk
