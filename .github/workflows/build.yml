name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar erros
        if: failure()
        run: |
          grep -vE "^> Task" build.log | grep -E "^e: |rror|What went wrong|Could not|^> |Caused by" | head -40 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done

      - name: Resultados de desempenho
        if: success()
        run: |
          if [ -f app/build/desempenho.txt ]; then
            while IFS= read -r l; do echo "::notice title=Desempenho::$l"; done < app/build/desempenho.txt
          fi

      - name: Fotos das telas (testes)
        if: always()
        run: |
          [ -d app/build/telas ] || exit 0
          cd app/build/telas
          git init -q && git checkout -q -b telas && git add *.png
          git -c user.name=novely-ci -c user.email=ci@novely commit -qm "telas do build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" telas

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Novely build ${{ github.run_number }}"
          body: |
            ${{ github.event.head_commit.message }}

            APK gerado automaticamente. Baixe o arquivo .apk abaixo e instale.
          files: app/build/outputs/apk/release/*.apk
